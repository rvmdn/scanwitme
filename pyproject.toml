[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanwitme"
version = "1.0.0"
description = "Windows desktop floating screen translator for manga, manhwa, and manhua readers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ScanWitMe Contributors" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
    "pynput>=1.7.6",
    "pillow>=10.0.0",
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[project.scripts]
scanwitme = "scanwitme.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests that run isolated in memory",
    "integration: Integration tests with mocked or local adapters",
    "ui: UI tests verifying PySide6 widgets and dialogs",
    "ocr_live: Live PaddleOCR tests that require downloaded models",
    "live_api: Opt-in tests requiring live external credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "N818", # exception name should end in Error (e.g. CaptureCancelled)
    "N802", # Qt event handlers like mousePressEvent use camelCase
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
